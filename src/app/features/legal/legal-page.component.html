<main class="legal">
  <a class="legal__back" routerLink="/">{{ 'legal.back' | translate }}</a>

  <h1 class="legal__title">{{ titleKey() | translate }}</h1>
  <p class="legal__updated">{{ 'legal.updated' | translate }}</p>

  @for (section of asSections(sectionsKey() | translate); track section.heading) {
    <section class="legal__section">
      <h2>{{ section.heading }}</h2>
      <p>{{ section.body }}</p>
    </section>
  }
</main>
