<div class="formbox">
  <div class="eyebrow">로그인 · Вход</div>
  <h1>Войти в аккаунт</h1>
  <p class="sub">Рад снова видеть тебя 👋</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <hg-input id="email" type="email" label="Email" formControlName="email"
              placeholder="you@email.com" autocomplete="email"
              [error]="invalid('email') ? 'Введи корректный email' : ''"/>

    <hg-input id="password" type="password" label="Пароль" formControlName="password"
              placeholder="••••••••" autocomplete="current-password"
              [error]="invalid('password') ? 'Введи пароль' : ''"/>

    @if (facade.error(); as error) {
      <div class="apierr">{{ error }}</div>
    }

    <hg-button class="btn" type="submit" label="Войти" [loading]="facade.loading()" block/>
  </form>

  <div class="sep">или через</div>
  <div class="social">
    <hg-button label="Google" variant="secondary" block (pressed)="facade.loginWithProvider('google')"/>
    <hg-button label="Kakao" variant="secondary" block (pressed)="facade.loginWithProvider('kakao')"/>
  </div>

  <div class="alt">Нет аккаунта? <a routerLink="/auth/register">Зарегистрироваться</a></div>
</div>
