<div class="formbox">
  <div class="eyebrow">회원가입 · Регистрация</div>
  <h1>Создать аккаунт</h1>
  <p class="sub">Займёт меньше минуты.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <hg-input id="name" type="text" label="Имя" formControlName="name" placeholder="Сергей"
              autocomplete="name" [error]="invalid('name') ? 'Как тебя зовут?' : ''"/>

    <hg-input id="email" type="email" label="Email" formControlName="email" placeholder="you@email.com"
              autocomplete="email" [error]="invalid('email') ? 'Введи корректный email' : ''"/>

    <hg-input id="password" type="password" label="Пароль" formControlName="password"
              placeholder="Минимум 8 символов" autocomplete="new-password"
              [error]="invalid('password') ? 'Пароль — минимум 8 символов' : ''"/>

    <hg-checkbox label="Принимаю условия и политику" formControlName="consent"/>
    @if (invalid('consent')) {
      <div class="apierr">Нужно принять условия, чтобы продолжить</div>
    }

    @if (facade.error(); as error) {
      <div class="apierr">{{ error }}</div>
    }

    <hg-button class="btn" type="submit" label="Создать аккаунт" [loading]="facade.loading()" block/>
  </form>

  <div class="sep">или через</div>
  <div class="social">
    <hg-button label="Google" variant="secondary" block (pressed)="facade.loginWithProvider('google')"/>
    <hg-button label="Kakao" variant="secondary" block (pressed)="facade.loginWithProvider('kakao')"/>
  </div>

  <div class="alt">Уже есть аккаунт? <a routerLink="/auth/login">Войти</a></div>
</div>
