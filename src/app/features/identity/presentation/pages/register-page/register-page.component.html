<div class="formbox">
  <div class="eyebrow">{{ "identity.register.eyebrow" | translate }}</div>
  <h1>{{ "identity.register.title" | translate }}</h1>
  <p class="sub">{{ "identity.register.subtitle" | translate }}</p>

  <form novalidate (submit)="$event.preventDefault(); submit()">
    <app-form-field
      class="hg-auth-field"
      [field]="form.name"
      [isInline]="false"
      [submitted]="submitted()"
      [label]="'common.name' | translate"
      [showLabel]="false"
      [errorMessages]="{
        required: ('identity.validation.name' | translate),
        maxLength: ('identity.validation.name' | translate),
      }"
    >
      <app-basic-input
        type="text"
        [formField]="form.name"
        [placeholder]="'common.name' | translate"
        autocomplete="name"
      />
    </app-form-field>

    <app-form-field
      class="hg-auth-field"
      [field]="form.email"
      [isInline]="false"
      [submitted]="submitted()"
      [label]="'common.email' | translate"
      [showLabel]="false"
      [errorMessages]="{
        required: ('identity.validation.email' | translate),
        email: ('identity.validation.email' | translate),
      }"
    >
      <app-basic-input
        type="email"
        [formField]="form.email"
        [placeholder]="'common.email' | translate"
        autocomplete="common.email' | translate"
        autocapitalize="off"
      />
    </app-form-field>

    <app-form-field
      class="hg-auth-field"
      [field]="form.password"
      [isInline]="false"
      [submitted]="submitted()"
      [label]="'common.password' | translate"
      [showLabel]="false"
      [errorMessages]="{
        required: ('identity.validation.passwordRequired' | translate),
        minLength: ('identity.validation.passwordMin' | translate),
      }"
    >
      <app-password-input
        [toggleMask]="false"
        [formField]="form.password"
        [placeholder]="'common.password' | translate"
        autocomplete="new-password"
      />
    </app-form-field>

    <app-form-field
      class="hg-auth-field hg-auth-consent"
      [field]="form.consent"
      [isInline]="false"
      [submitted]="submitted()"
      [errorMessages]="{
        required: ('identity.validation.consent' | translate),
      }"
    >
      <app-checkbox
        [label]="'identity.register.consent' | translate"
        [formField]="form.consent"
      />
    </app-form-field>

    @if (facade.error(); as error) {
      <div class="apierr">{{ error }}</div>
    }

    <app-button
      class="btn"
      type="submit"
      [label]="'identity.register.submit' | translate"
      [loading]="facade.loading()"
      styleClass="hg-button hg-button--block"
    />
  </form>

  <div class="alt">
    {{ "identity.register.hasAccount" | translate }}
    <a routerLink="/auth/login">{{ "identity.login.submit" | translate }}</a>
  </div>
</div>
