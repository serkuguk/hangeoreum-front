<svg class="mascot" viewBox="0 0 200 210" xmlns="http://www.w3.org/2000/svg" aria-label="Маскот-тигрёнок слушает">
  <style>
.pupils{animation:look 6s ease-in-out infinite}
@keyframes look{
  0%,20%{transform:translate(0,0)}
  28%,45%{transform:translate(5px,0)}
  52%,70%{transform:translate(-5px,1px)}
  78%,100%{transform:translate(0,0)}
}
/* моргание */
.lids{transform:scaleY(0);transform-origin:center 118px;animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
/* ушки */
.ear-l{transform-origin:52px 42px;animation:twitch 5s infinite}
@keyframes twitch{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-8deg)}96%{transform:rotate(4deg)}}
/* звуковые волны у наушников */
.wave{opacity:0;animation:wave 1.6s ease-out infinite}
.wave.w2{animation-delay:.4s}
@keyframes wave{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.3)}}

@media(prefers-reduced-motion:reduce){.pupils,.lids,.ear-l,.wave{animation:none}}
  </style>
      <!-- звуковые волны -->
      <g stroke="#FFC23C" stroke-width="4" fill="none" stroke-linecap="round">
        <path class="wave" d="M178 95 q14 15 0 30" style="transform-origin:178px 110px"/>
        <path class="wave w2" d="M186 88 q22 22 0 44" style="transform-origin:186px 110px"/>
      </g>
      <!-- уши -->
      <g class="ear-l"><circle cx="52" cy="46" r="17" fill="#FFB020"/><circle cx="52" cy="46" r="9" fill="#7a4a00"/></g>
      <circle cx="148" cy="46" r="17" fill="#FFB020"/><circle cx="148" cy="46" r="9" fill="#7a4a00"/>
      <!-- голова -->
      <ellipse cx="100" cy="105" rx="72" ry="66" fill="#FFC23C"/>
      <!-- полоски тигра -->
      <g fill="#c47800" opacity=".85">
        <path d="M40 78 q14 6 12 18 l-8 -2 q-6 -9 -4 -16z"/>
        <path d="M160 78 q-14 6 -12 18 l8 -2 q6 -9 4 -16z"/>
        <path d="M92 44 q8 10 0 18 q-8 -8 0 -18z"/>
      </g>
      <!-- наушники -->
      <path d="M34 96 Q100 8 166 96" stroke="#2A2838" stroke-width="13" fill="none" stroke-linecap="round"/>
      <rect x="20" y="88" width="26" height="44" rx="12" fill="#211F2E" stroke="#3B6BFF" stroke-width="3"/>
      <rect x="154" y="88" width="26" height="44" rx="12" fill="#211F2E" stroke="#3B6BFF" stroke-width="3"/>
      <!-- морда -->
      <ellipse cx="100" cy="128" rx="34" ry="26" fill="#FFE9C2"/>
      <!-- глаза -->
      <g>
        <ellipse cx="76" cy="102" rx="15" ry="16" fill="#fff"/>
        <ellipse cx="124" cy="102" rx="15" ry="16" fill="#fff"/>
        <g class="pupils">
          <circle cx="76" cy="104" r="7.5" fill="#1b1426"/>
          <circle cx="124" cy="104" r="7.5" fill="#1b1426"/>
          <circle cx="79" cy="101" r="2.4" fill="#fff"/>
          <circle cx="127" cy="101" r="2.4" fill="#fff"/>
        </g>
        <!-- веки для моргания -->
        <g class="lids" fill="#FFC23C">
          <ellipse cx="76" cy="102" rx="16" ry="17"/>
          <ellipse cx="124" cy="102" rx="16" ry="17"/>
        </g>
      </g>
      <!-- нос и рот -->
      <path d="M93 122 q7 -6 14 0 q-3 8 -7 8 q-4 0 -7 -8z" fill="#FF4D5E"/>
      <path d="M100 130 v7 M100 137 q-7 8 -15 3 M100 137 q7 8 15 3" stroke="#7a4a00" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- лапки -->
      <ellipse cx="62" cy="186" rx="20" ry="15" fill="#FFB020"/>
      <ellipse cx="138" cy="186" rx="20" ry="15" fill="#FFB020"/>
    </svg>
