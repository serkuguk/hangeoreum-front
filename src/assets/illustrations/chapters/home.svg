<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img">
  <!--
    한걸음 chapter illustration: home / 집 (at home, daily life)
    A house built directly from the syllable-block grid (roof = top section,
    body = middle, door = batchim band); learner stands in the doorway.
    Palette: surface #fffdf9, text #192230, route #004dbb (roof), route-soft #d4e6ff (window).
  -->
  <rect x="16" y="16" width="208" height="208" rx="28" fill="#fffdf9"/>

  <!-- house body = the block's middle section -->
  <rect x="58" y="96" width="124" height="92" rx="10" fill="#d4e6ff" stroke="#192230" stroke-width="3"/>
  <!-- roof = the top (초성) section, a triangle spanning the block width -->
  <path d="M48 98 L120 46 L192 98 Z" fill="#004dbb" stroke="#192230" stroke-width="3" stroke-linejoin="round"/>
  <!-- window -->
  <rect x="72" y="112" width="34" height="34" rx="6" fill="#fffdf9" stroke="#192230" stroke-width="2"/>
  <line x1="89" y1="112" x2="89" y2="146" stroke="#192230" stroke-width="2"/>
  <line x1="72" y1="129" x2="106" y2="129" stroke="#192230" stroke-width="2"/>

  <!-- doorway = batchim band; learner framed inside it -->
  <rect x="128" y="132" width="40" height="56" rx="6" fill="#192230"/>
  <g>
    <rect x="136" y="150" width="24" height="38" rx="9" fill="#004dbb"/>
    <rect x="139" y="126" width="18" height="18" rx="7" fill="#fffdf9"/>
    <path d="M148 123 q4 -6 8 -1 q-4 -2 -8 1 Z" fill="#fffdf9"/>
  </g>
</svg>
