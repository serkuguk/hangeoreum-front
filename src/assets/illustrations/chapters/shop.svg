<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img">
  <!--
    한걸음 chapter illustration: shop / 가게 (shopping, paying)
    Learner carries a shopping bag; a price/coin marks the transaction.
    Palette: surface #fffdf9, text #192230, success #007147 (bag), reward #dfa72a (coin).
  -->
  <rect x="16" y="16" width="208" height="208" rx="28" fill="#fffdf9"/>
  <g stroke="#192230" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round">
    <line x1="120" y1="40" x2="120" y2="176"/>
    <line x1="40" y1="176" x2="200" y2="176"/>
  </g>

  <!-- learner (left) -->
  <g>
    <rect x="50" y="132" width="42" height="44" rx="14" fill="#004dbb"/>
    <rect x="54" y="86" width="34" height="34" rx="12" fill="#192230"/>
    <path d="M71 82 q6 -10 12 -2 q-6 -3 -12 2 Z" fill="#192230"/>
    <!-- arm holding bag handle -->
    <line x1="90" y1="138" x2="112" y2="128" stroke="#192230" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- shopping bag (right) -->
  <g>
    <rect x="112" y="118" width="56" height="58" rx="8" fill="#007147"/>
    <!-- handles -->
    <path d="M124 118 v-8 a8 8 0 0 1 16 0 v8" fill="none" stroke="#192230" stroke-width="4"/>
    <path d="M140 118 v-8 a8 8 0 0 1 16 0 v8" fill="none" stroke="#192230" stroke-width="4"/>
  </g>

  <!-- coin = payment (upper right, in the "vowel" region) -->
  <g>
    <circle cx="180" cy="70" r="18" fill="#dfa72a" stroke="#192230" stroke-width="3"/>
    <circle cx="180" cy="70" r="9" fill="none" stroke="#192230" stroke-width="3"/>
  </g>
</svg>
